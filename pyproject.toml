[project]
name = "domo-tech"
version = "0.2.0"
description = ""
authors = [
    {name = "Wilmar A. Giraldo Sanchez",email = "wilmardvlpr@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "rich (>=15.0.0,<16.0.0)",
    "textual (>=8.2.5,<9.0.0)",
    "bcrypt (>=4.0.0,<5.0.0)",
]

[tool.poetry]
packages = [{include = "domo_tech", from = "src"}]

[project.scripts]
domotech = "domo_tech.domotech:main"
branding = "domo_tech.ui.branding:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
